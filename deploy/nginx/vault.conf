# Vault Manager — Nginx reverse proxy
#
# Prerequisites:
#   - TLS certificate at /etc/ssl/vault/cert.pem and key.pem
#   - The Express server running on 127.0.0.1:3000 (serves index.html with nonce injection)
#   - Static assets built into /home/pwd-vm/PWDnow/web/dist/
#
# Install:
#   sudo cp vault.conf /etc/nginx/sites-available/vault.conf
#   sudo ln -sf /etc/nginx/sites-available/vault.conf /etc/nginx/sites-enabled/vault.conf
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones (stored in shared memory)
# auth_limit: 5 req/min per IP on auth paths
limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=5r/m;
# general_limit: 300 req/min per IP on all other paths
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;

# ── HTTPS server ──────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.local;

    # TLS 1.3 only (architecture §11: TLS 1.3 + HSTS)
    ssl_protocols TLSv1.3;
    # H-07 fix: explicit cipher list (TLS 1.3 suites only) so the intent is clear
    # and resistant to nginx config merges that might re-enable legacy ciphers.
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;

    ssl_certificate     /etc/ssl/vault/cert.pem;
    ssl_certificate_key /etc/ssl/vault/key.pem;

    # TLS session resumption (forward secrecy maintained — tickets disabled)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Limit request body to 4 MiB (matches daemon 4 MiB frame cap)
    client_max_body_size 4m;

    # OCSP stapling — requires the full chain cert.pem
    ssl_stapling on;
    ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/ssl/vault/ca-chain.pem;  # uncomment when using a CA
    # LOW-04: use a public DNSSEC-validating resolver for OCSP stapling.
    # 1.1.1.1 (Cloudflare) and 8.8.8.8 (Google) validate DNSSEC.
    # Operators may replace with a local DNSSEC-validating resolver.
    resolver 1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout 5s;

    # ── Security headers ──────────────────────────────────────────────────────

    # L-04 fix: suppress nginx version disclosure
    server_tokens off;

    # HSTS: 1 year, includeSubDomains, preload (architecture §10)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # M-08 fix: restrict browser feature access
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=()" always;
    # L-05 fix: block legacy Flash/PDF cross-domain requests
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Note: Content-Security-Policy with per-request nonce is injected by the
    # Express server (server.js) and must NOT be set here to avoid duplicate headers.

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Static assets (Vite content-addressed filenames, long cache) ──────────

    root /home/pwd-vm/PWDnow/web/dist;

    location ~* ^/assets/ {
        # Vite names bundles with content hashes — safe to cache aggressively
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_req zone=general_limit burst=100 nodelay;
        try_files $uri =404;
    }

    # ── WebSocket proxy (daemon bridge) ──────────────────────────────────────

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # No rate limit on WebSocket — one long-lived connection per session
    }

    # ── Auth-path rate limiting ───────────────────────────────────────────────
    # The Express server has no HTTP auth routes (all auth goes through WebSocket),
    # but this block is a placeholder for future REST auth endpoints.
    # location ~ ^/api/v1/auth/ {
    #     limit_req zone=auth_limit burst=3 nodelay;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }

    # ── SPA fallback — all other routes go to Express for nonce injection ─────

    location / {
        # Serve static files directly when they exist; fall back to Express for
        # index.html (which requires per-request nonce injection).
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Deny dotfiles ─────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name vault.local;
    return 301 https://$server_name$request_uri;
}
