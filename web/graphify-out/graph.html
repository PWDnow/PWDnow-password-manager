const tooltip = document.getElementById('tooltip');
const infoPanel = document.getElementById('info-panel');
const infoTitle = document.getElementById('info-title');
const infoBody = document.getElementById('info-body');

let W, H, nodes, edges, nodeMap = {}, adjMap = {};
let transform = {x:0,y:0,scale:1};
let dragging=false, lastMouse={x:0,y:0}, hoveredNode=null, selectedNode=null;
let activeGroups = new Set(Object.keys(GRAPH.communities));
let searchQuery='';

function init(){
  resize();
  buildGraph();
  buildFilters();
  layout();
  render();
}

function resize(){
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W; canvas.height = H;
}

function buildGraph(){
  nodeMap={};
  nodes = GRAPH.nodes.map(n=>({...n,x:W/2+(Math.random()-.5)*600,y:H/2+(Math.random()-.5)*600,vx:0,vy:0,r:14}));
  nodes.forEach(n=>nodeMap[n.id]=n);
  adjMap={};
  edges = GRAPH.edges.map(e=>({...e,source:nodeMap[e.source],target:nodeMap[e.target]})).filter(e=>e.source&&e.target);
  edges.forEach(e=>{
    if(!adjMap[e.source.id])adjMap[e.source.id]=[];
    if(!adjMap[e.target.id])adjMap[e.target.id]=[];
    adjMap[e.source.id].push(e.target.id);
    adjMap[e.target.id].push(e.source.id);
  });
  document.getElementById('stats').textContent=`${nodes.length} nodes · ${edges.length} edges`;
}

function buildFilters(){
  const div = document.getElementById('group-filters');
  div.innerHTML='';
  Object.entries(GRAPH.communities).forEach(([k,v])=>{
    const chip = document.createElement('div');
    chip.className='chip active';
    chip.style.background=v.color+'33';
    chip.style.color=v.color;
    chip.textContent=v.label;
    chip.onclick=()=>{
      if(activeGroups.has(k)){if(activeGroups.size>1)activeGroups.delete(k);}
      else activeGroups.add(k);
      chip.classList.toggle('active',activeGroups.has(k));
      render();
    };
    div.appendChild(chip);
  });
}

function layout(){
  const cx=W/2, cy=H/2;
  const groups={'daemon':[],'web':[],'monitor':[],'infra':[]};
  nodes.forEach(n=>{if(groups[n.group])groups[n.group].push(n);});
  const positions={'daemon':{x:cx-260,y:cy-80},'web':{x:cx+180,y:cy-60},'monitor':{x:cx-80,y:cy+220},'infra':{x:cx-80,y:cy-260}};
  Object.entries(groups).forEach(([g,ns])=>{
    const center=positions[g]||{x:cx,y:cy};
    ns.forEach((n,i)=>{
      const angle=(i/ns.length)*Math.PI*2;
      const r=Math.min(ns.length*18,170);
      n.x=center.x+Math.cos(angle)*r;
      n.y=center.y+Math.sin(angle)*r;
    });
  });
  for(let i=0;i<80;i++) tick();
}

function tick(){
  const k=0.05, repel=2200;
  nodes.forEach(a=>{
    nodes.forEach(b=>{
      if(a===b)return;
      const dx=a.x-b.x, dy=a.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=repel/(d*d);
      a.vx+=dx/d*f; a.vy+=dy/d*f;
    });
  });
  edges.forEach(e=>{
    const dx=e.target.x-e.source.x, dy=e.target.y-e.source.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const ideal=160;
    const f=(d-ideal)*k;
    e.source.vx+=dx/d*f; e.source.vy+=dy/d*f;
    e.target.vx-=dx/d*f; e.target.vy-=dy/d*f;
  });
  nodes.forEach(n=>{n.x+=n.vx*0.5;n.y+=n.vy*0.5;n.vx*=0.7;n.vy*=0.7;});
}

function worldToScreen(x,y){return{x:x*transform.scale+transform.x,y:y*transform.scale+transform.y};}
function screenToWorld(x,y){return{x:(x-transform.x)/transform.scale,y:(y-transform.y)/transform.scale};}

function visibleNodes(){
  return nodes.filter(n=>activeGroups.has(n.group)&&(!searchQuery||n.label.toLowerCase().includes(searchQuery)||n.desc.toLowerCase().includes(searchQuery)));
}

function render(){
  ctx.clearRect(0,0,W,H);
  const visible = new Set(visibleNodes().map(n=>n.id));
  
  // edges
  edges.forEach(e=>{
    if(!visible.has(e.source.id)||!visible.has(e.target.id))return;
    const s=worldToScreen(e.source.x,e.source.y);
    const t=worldToScreen(e.target.x,e.target.y);
    const isActive = selectedNode&&(e.source.id===selectedNode.id||e.target.id===selectedNode.id);
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(t.x,t.y);
    ctx.strokeStyle=isActive?'#818cf8aa':'#334155';
    ctx.lineWidth=isActive?2:1;
    ctx.stroke();
    // arrow
    const angle=Math.atan2(t.y-s.y,t.x-s.x);
    const ar=12*transform.scale;
    ctx.beginPath();
    ctx.moveTo(t.x,t.y);
    ctx.lineTo(t.x-ar*Math.cos(angle-0.4),t.y-ar*Math.sin(angle-0.4));
    ctx.lineTo(t.x-ar*Math.cos(angle+0.4),t.y-ar*Math.sin(angle+0.4));
    ctx.closePath();
    ctx.fillStyle=isActive?'#818cf8aa':'#334155';
    ctx.fill();
  });

  // nodes
  visibleNodes().forEach(n=>{
    const {x,y}=worldToScreen(n.x,n.y);
    const r=n.r*transform.scale;
    const color=COLORS[n.group]||'#64748b';
    const isSelected=selectedNode&&selectedNode.id===n.id;
    const isHovered=hoveredNode&&hoveredNode.id===n.id;
    
    ctx.beginPath();
    ctx.arc(x,y,r+(isSelected?4:isHovered?2:0),0,Math.PI*2);
    ctx.fillStyle=color+(isSelected?'ff':isHovered?'cc':'55');
    ctx.fill();
    ctx.strokeStyle=color+(isSelected?'ff':'99');
    ctx.lineWidth=isSelected?3:1.5;
    ctx.stroke();

    // label
    const fontSize=Math.max(9,11*transform.scale);
    ctx.font=`${fontSize}px Segoe UI,sans-serif`;
    ctx.fillStyle=isSelected||isHovered?'#f1f5f9':'#94a3b8';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const shortLabel=n.label.length>18?n.label.slice(0,16)+'…':n.label;
    ctx.fillText(shortLabel,x,y+r+fontSize*0.9);
  });
}

function hitTest(wx,wy){
  let closest=null, minD=Infinity;
  visibleNodes().forEach(n=>{
    const d=Math.hypot(n.x-wx,n.y-wy);
    if(d<n.r*1.5&&d<minD){minD=d;closest=n;}
  });
  return closest;
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(dragging){
    transform.x+=mx-lastMouse.x;
    transform.y+=my-lastMouse.y;
    lastMouse={x:mx,y:my};
    render(); return;
  }
  const w=screenToWorld(mx,my);
  const hit=hitTest(w.x,w.y);
  if(hit!==hoveredNode){hoveredNode=hit;render();}
  if(hit){
    tooltip.style.display='block';
    tooltip.style.left=(e.clientX+14)+'px';
    tooltip.style.top=(e.clientY-10)+'px';
    tooltip.querySelector('.t-label').textContent=hit.label;
    tooltip.querySelector('.t-desc').textContent=hit.desc;
  } else tooltip.style.display='none';
});

canvas.addEventListener('mousedown',e=>{
  dragging=true;
  lastMouse={x:e.clientX-canvas.getBoundingClientRect().left,y:e.clientY-canvas.getBoundingClientRect().top};
});

canvas.addEventListener('mouseup',e=>{
  const moved=Math.hypot(e.movementX,e.movementY)<3;
  dragging=false;
  if(moved){
    const rect=canvas.getBoundingClientRect();
    const w=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
    const hit=hitTest(w.x,w.y);
    if(hit){openPanel(hit);}
    else{selectedNode=null;infoPanel.classList.remove('open');render();}
  }
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const factor=e.deltaY>0?0.85:1.18;
  const newScale=Math.max(0.2,Math.min(4,transform.scale*factor));
  transform.x=mx+(transform.x-mx)*newScale/transform.scale;
  transform.y=my+(transform.y-my)*newScale/transform.scale;
  transform.scale=newScale;
  render();
},{passive:false});

function openPanel(n){
  selectedNode=n;
  infoPanel.classList.add('open');
  infoTitle.textContent=n.label;
  const neighbors=(adjMap[n.id]||[]).map(id=>nodeMap[id]).filter(Boolean);
  infoBody.innerHTML=`
    <div class="info-row"><div class="info-label">Group</div><div class="info-value">${GRAPH.communities[n.group]?.label||n.group}</div></div>
    <div class="info-row"><div class="info-label">Type</div><div class="info-value">${n.type}</div></div>
    <div class="info-row"><div class="info-label">File</div><div class="info-value file">${n.file}</div></div>
    <div class="info-row"><div class="info-label">Description</div><div class="info-value">${n.desc}</div></div>
    <div class="info-row"><div class="info-label">Connections (${neighbors.length})</div>
      <div class="conn-list">${neighbors.map(nb=>`<div class="conn-item" onclick="openPanel(nodeMap['${nb.id}'])">${nb.label}</div>`).join('')}</div>
    </div>`;
  render();
}

document.getElementById('info-close').onclick=()=>{
  selectedNode=null;infoPanel.classList.remove('open');render();
};

document.getElementById('search').addEventListener('input',e=>{
  searchQuery=e.target.value.toLowerCase().trim();
  render();
});

window.addEventListener('resize',()=>{resize();render();});
window.nodeMap=nodeMap;
init();
</script>
</body>
</html>
