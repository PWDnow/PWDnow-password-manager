[package]
name        = "vault-daemon"
version     = "0.1.0"
edition     = "2021"

[[bin]]
name = "vault-daemon"
path = "src/main.rs"

[dependencies]
tokio              = { version = "=1.51.1", features = ["full"] }
rmp-serde          = "1.3"
serde              = { version = "1.0", features = ["derive"] }
serde_bytes        = "0.11"
libsodium-sys      = { version = "0.2", default-features = false, features = ["use-pkg-config"] }
argon2             = { version = "=0.5.3", features = ["std", "password-hash"] }
aes-gcm            = { version = "0.10", features = ["std"] }
image              = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chacha20poly1305   = { version = "=0.10.1", features = ["std"] }
blake3             = "1.5"
zeroize            = { version = "=1.8.2", features = ["derive", "zeroize_derive"] }
rusqlite           = { version = "=0.32.1", features = ["sqlcipher"] }
uuid               = { version = "1.11", features = ["v4", "serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror          = "2.0"
anyhow             = "1.0"
nix                = { version = "0.29", features = ["socket", "process", "user", "mman"] }
sd-notify          = "0.4"
chrono             = { version = "0.4", features = ["serde"] }
hex                = "0.4"
totp-rs            = { version = "5.7", default-features = false, features = ["gen_secret"] }
hkdf               = "0.12"
sha1               = "0.10"
sha2               = "0.10"
sha3               = "0.10"
rand_core          = { version = "0.6", features = ["getrandom"] }
x25519-dalek       = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek      = { version = "2.1", features = ["rand_core"] }
ml-kem             = { version = "0.3.0", features = ["hazmat"] }
base64             = "0.22"
ureq               = { version = "2.12", features = ["tls"] }
zstd               = "0.13"
base32             = "0.4"
serde_json         = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
libc = "0.2.186"
tss-esapi = "7.7.0"
cryptoki = "0.12.0"
ml-dsa = "0.1.0-rc.9"
x448 = { version = "0.14.0-pre.9", features = ["static_secrets", "getrandom"] }
pbkdf2 = "0.12.2"
hmac = "0.12.1"

[build-dependencies]
bindgen  = "0.72"
pkg-config = "0.3"

[features]
default        = ["pq-hybrid-1024"]
pq-hybrid-1024 = []
mock-fido2     = []
legacy-overwrite = []
# CNSA 2.0 strict mode: forces SHA-384 HKDF, PBKDF2-SHA-512, SHA-384 audit hash,
# removes BLAKE3/SHA3/XChaCha20/Ed25519/X25519 from all active code paths.
cnsa-strict    = ["pq-hybrid-1024"]

[dev-dependencies]
tokio    = { version = "1.44", features = ["full", "test-util"] }
tempfile = "3.14"
hex      = "0.4"
rmpv     = { version = "1.3", features = ["with-serde"] }
proptest = "1.11.0"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
