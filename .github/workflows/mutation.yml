# SLA P3: nightly mutation testing (cargo-mutants).
# Block per-PR is too slow (~30 min on daemon); cron runs nightly and
# uploads mutants/ HTML report. Ops reviews weekly. Below 60% (daemon) /
# 50% (monitor) the cron flags but does not fail — drift is the signal.

name: Mutation Testing (nightly)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  mutants-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: daemon } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install C deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev protobuf-compiler \
            libsodium-dev libfido2-dev libsqlcipher-dev
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-mutants }
      - run: cargo mutants --no-shuffle --timeout 300 --output mutants.out --jobs 2 || true
      - uses: actions/upload-artifact@v4
        with: { name: mutants-daemon, path: daemon/mutants.out/ }

  mutants-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: monitor } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-mutants }
      - run: cargo mutants --no-shuffle --timeout 60 --output mutants.out --jobs 2 || true
      - uses: actions/upload-artifact@v4
        with: { name: mutants-monitor, path: monitor/mutants.out/ }
