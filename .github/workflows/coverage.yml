# SLA E1: PR coverage gate (currently soft — continue-on-error: true).
# Flip to hard once a baseline is established.

name: Coverage

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  daemon-coverage:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: daemon } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install C deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev protobuf-compiler \
            libsodium-dev libfido2-dev libsqlcipher-dev
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-tarpaulin }
      - name: Run coverage
        continue-on-error: true
        run: cargo tarpaulin --bin vault-daemon --out Xml --out Stdout --fail-under 85 --skip-clean
      - uses: actions/upload-artifact@v4
        with: { name: daemon-coverage, path: daemon/cobertura.xml }

  web-coverage:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - run: npm ci --strict-peer-deps
      - name: Run coverage
        continue-on-error: true
        run: npx vitest run --coverage --coverage.thresholds.lines=80 || true
      - uses: actions/upload-artifact@v4
        with: { name: web-coverage, path: web/coverage/ }
